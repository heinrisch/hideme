<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield shape (main background) -->
  <path d="M64 10 L20 30 L20 65 C20 90 35 110 64 118 C93 110 108 90 108 65 L108 30 Z" fill="url(#grad1)"/>
  
  <!-- Inner shield for depth -->
  <path d="M64 25 L30 40 L30 65 C30 85 42 100 64 108 C86 100 98 85 98 65 L98 40 Z" fill="url(#grad2)" opacity="0.8"/>
  
  <!-- Eye with slash (privacy/hidden symbol) -->
  <g transform="translate(64, 68)">
    <!-- Eye outline -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="7" fill="white"/>
    <!-- Slash through eye -->
    <line x1="-26" y1="-18" x2="26" y2="18" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
